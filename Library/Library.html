<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Library.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Library</title>
</head>
<body>
    <div>
        <div class="nav">
            <div class="nav_left">
                <div class="greeting">
                    <div>Hi there,</div>
                    <div class="name">Beamlak Bekele (@beamlak)</div>
                </div>
            </div>
            <div class="nav_right">
                <div class="notification"><span class="mdi mdi-bell-ring-outline"></span></div>
                <div class="hLogo"><span class="mdi mdi-account-circle"></span></div>
                <div class="name">Beamlak Bekele</div>
            </div>
        </div>
            <div class="projects">
                <h1>Books</h1>
                <div class="cards">
                </div>
            </div>
        </div>
        <div class="btn">
            <button id="new_btn" onclick=show_dialog()>New Book</button>
        </div> 
        
        <dialog id="new_book">
            <h1>Add New Book</h1>
            <form action="">
                <div class="wrapper">
                    <div>
                    <label for="Ftitle">Title:</label>
                    <input type="text" name="Ftitle" id="Ftitle">
                </div>
                <div>
                    <label for="Fautor">Autor:</label>
                    <input type="text" name="Fautor" id="Fautor">
                </div>
                <div>
                    <label for="Fpage">Page:</label>
                    <input type="number" name="Fpage" id="Fpage">
                </div>
                Hv u read this book?
                <div>
                    <label>
                        <input type="radio" name="read" value="yes"> Yes
                      </label>
                      <label>
                        <input type="radio" name="read" value="no" checked> No!!!!
                      </label>
                </div>
                <div class="buttons">
                    <button id="add_form">ADD</button>
                    <button type="reset">Reset</button>
                </div>
                </div>
            </form>
        </dialog>
</body>
<script src="Library.js"></script>
</html>
